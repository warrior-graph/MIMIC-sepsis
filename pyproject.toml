[project]
name = "mimic-sepsis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4.0",
    "lightgbm>=4.0.0",
    "lightning>=2.0.0",
    "matplotlib>=3.10.9",
    "numba>=0.60.0",
    "pandas>=3.0.3",
    "polars>=1.41.2",
    "prophet>=1.1.5",
    "pyarrow>=24.0.0",
    "pytorch-forecasting>=1.3.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
# GPU acceleration: install with `uv sync --extra gpu`
# NOTE: cuml (RAPIDS) must be installed separately via:
#   uv pip install cuml-cu12 --extra-index-url https://pypi.nvidia.com
#   OR: conda install -c rapidsai -c conda-forge cuml=24.06 cuda-version=12.0
gpu = [
    "cupy-cuda12x>=13.0.0",
]
